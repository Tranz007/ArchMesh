  <g opacity="0.9">
    <rect x="182" y="267" width="110" height="66" rx="13" fill="#0F1B29" stroke="#55D4C4" stroke-opacity="0.52"/>
    <rect x="456" y="176" width="122" height="76" rx="14" fill="#101C2A" stroke="#4ED6C8" stroke-opacity="0.58"/>
    <rect x="765" y="203" width="134" height="88" rx="16" fill="#101C2C" stroke="#65BFEA" stroke-opacity="0.58"/>
