    <rect x="1329" y="332" width="118" height="66" rx="13" fill="#121A31" stroke="#8E78F4" stroke-opacity="0.48"/>
  </g>

  <g fill="#D8E6F2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="237" y="294" text-anchor="middle" font-size="15" font-weight="600">Product</text>
    <text x="517" y="207" text-anchor="middle" font-size="15" font-weight="600">Experience</text>
    <text x="832" y="238" text-anchor="middle" font-size="15" font-weight="600">Services</text>
    <text x="1181" y="227" text-anchor="middle" font-size="15" font-weight="600">Data + APIs</text>
    <text x="1388" y="359" text-anchor="middle" font-size="15" font-weight="600">External</text>
  </g>

  <g fill="#94AABD" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">
    <text x="237" y="314" text-anchor="middle">features · flows</text>
    <text x="517" y="229" text-anchor="middle">routes · UI</text>
    <text x="832" y="261" text-anchor="middle">logic · dependencies</text>
    <text x="1181" y="249" text-anchor="middle">stores · contracts</text>
    <text x="1388" y="379" text-anchor="middle">integrations</text>
  </g>

  <g opacity="0.52">
    <circle cx="314" cy="116" r="72" fill="#4BD2C4" filter="url(#soft)"/>
    <circle cx="1265" cy="430" r="80" fill="#7E72F3" filter="url(#soft)"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="120" y="500" fill="#EAF3FA" font-size="28" font-weight="700" letter-spacing="0.2">ArchMesh</text>
    <text x="120" y="530" fill="#8FA7BB" font-size="16">Make the system visible.</text>
  </g>
</svg>