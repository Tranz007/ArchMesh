name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: package.json

      - name: Apply viewport-fit race fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/GraphCanvas.tsx')
          text = path.read_text()
          marker = 'The force engine can finish while the canvas is still at its initial 1×1'
          if marker in text:
              raise SystemExit(0)

          start = text.index('  const fitGraph = () => {')
          end = text.index('  const toggleFlow = () => {', start)
          new = '''  const fitGraph = () => {
            const graph = graphRef.current;
            if (!graph || graphData.nodes.length === 0 || size.width < 120 || size.height < 120) return false;
            graph.zoomToFit(450, 72);
            fittedGraphRef.current = graphIdentity;
            return true;
          };

          useEffect(() => {
            if (graphData.nodes.length === 0 || size.width < 120 || size.height < 120) return undefined;
            if (fittedGraphRef.current === graphIdentity) return undefined;

            // The force engine can finish while the canvas is still at its initial 1×1
            // measurement. Fit only after ResizeObserver has reported a real viewport;
            // otherwise a failed early fit can leave the camera effectively miles away.
            const timer = window.setTimeout(() => {
              if (fittedGraphRef.current !== graphIdentity) fitGraph();
            }, 120);

            return () => window.clearTimeout(timer);
          }, [graphData.nodes.length, graphIdentity, size.height, size.width]);

'''
          path.write_text(text[:start] + new + text[end:])
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Compiled CLI help
        run: node dist/cli.js --help

      - name: Package dry run
        run: npm run pack:check

      - name: Packed install smoke test
        run: npm run smoke:package

      - name: Self scan
        run: npm run scan -- .

      - name: Headless viewer render
        id: viewer
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER=none
          node dist/cli.js . > /tmp/archmesh-viewer.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          ready=0
          for i in {1..60}; do
            if curl -fsS http://localhost:4242/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/archmesh-viewer.log
            exit 1
          fi

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium binary available on runner"
            exit 1
          fi

          set +e
          timeout 45s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --use-angle=swiftshader \
            --window-size=1728,950 \
            --virtual-time-budget=10000 \
            --screenshot=/tmp/archmesh-viewer.png \
            http://localhost:4242/ \
            2> /tmp/chrome-viewer.log
          chrome_status=$?
          set -e

          echo "--- ArchMesh server ---"
          cat /tmp/archmesh-viewer.log
          echo "--- Chrome ---"
          cat /tmp/chrome-viewer.log
          echo "Chrome status: $chrome_status"
          test -s /tmp/archmesh-viewer.png

          cp src/GraphCanvas.tsx /tmp/GraphCanvas.tsx
          cp public/archmesh.json /tmp/archmesh.json

      - name: Upload viewer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-render
          path: |
            /tmp/archmesh-viewer.png
            /tmp/archmesh-viewer.log
            /tmp/chrome-viewer.log
            /tmp/GraphCanvas.tsx
            /tmp/archmesh.json
          if-no-files-found: warn

      - name: Commit verified viewport-fit fix
        if: success()
        shell: bash
        run: |
          if git diff --quiet -- src/GraphCanvas.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GraphCanvas.tsx
          git commit -m "fix: fit graph after viewport measurement"
          git push origin HEAD:fix/render-root-cause
