name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Compiled CLI help
        run: node dist/cli.js --help

      - name: Package dry run
        run: npm run pack:check

      - name: Packed install smoke test
        run: npm run smoke:package

      - name: Self scan
        run: npm run scan -- .

      - name: Headless viewer render
        id: viewer
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER=none
          node dist/cli.js . > /tmp/archmesh-viewer.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          ready=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4242/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/archmesh-viewer.log
            exit 1
          fi

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium binary available on runner"
            exit 1
          fi

          set +e
          timeout 45s "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --use-angle=swiftshader \
            --window-size=1728,950 \
            --virtual-time-budget=10000 \
            --screenshot=/tmp/archmesh-viewer.png \
            http://127.0.0.1:4242/ \
            2> /tmp/chrome-viewer.log
          chrome_status=$?
          set -e

          echo "--- ArchMesh server ---"
          cat /tmp/archmesh-viewer.log
          echo "--- Chrome ---"
          cat /tmp/chrome-viewer.log
          echo "Chrome status: $chrome_status"
          test -s /tmp/archmesh-viewer.png

      - name: Upload viewer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-render
          path: |
            /tmp/archmesh-viewer.png
            /tmp/archmesh-viewer.log
            /tmp/chrome-viewer.log
          if-no-files-found: warn
